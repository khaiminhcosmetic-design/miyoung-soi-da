<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tất cả lead - MIYOUNG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div id="topbar-mount"></div>
<div class="wrap">
  <h1>Tất cả lead</h1>

  <div class="card">
    <div class="filters">
      <div>
        <label for="f-phone">Số điện thoại</label>
        <input type="text" id="f-phone" placeholder="09xxxxxxxx">
      </div>
      <div>
        <label for="f-khung-gio">Khung giờ</label>
        <select id="f-khung-gio"><option value="">Tất cả</option><option value="08-11">8h – 11h</option><option value="11-14">11h – 14h</option><option value="14-17">14h – 17h</option><option value="17-20">17h – 20h</option></select>
      </div>
      <div>
        <label for="f-nhanh">Nhánh</label>
        <select id="f-nhanh"><option value="">Tất cả</option><option value="A">A</option><option value="B">B</option><option value="C">C</option></select>
      </div>
      <div>
        <label for="f-trang-thai">Trạng thái</label>
        <select id="f-trang-thai">
          <option value="">Tất cả</option>
          <option value="moi">Mới</option>
          <option value="da_goi">Đã gọi được</option>
          <option value="khong_nghe_1">Không nghe máy (lần 1)</option>
          <option value="khong_nghe_2">Không nghe máy (lần 2)</option>
          <option value="da_gui_cam_nang">Đã gửi cẩm nang</option>
          <option value="dung_lien_he">Dừng liên hệ</option>
        </select>
      </div>
      <div>
        <label for="f-uu-dai">Đồng ý ưu đãi</label>
        <select id="f-uu-dai"><option value="">Tất cả</option><option value="1">Có</option><option value="0">Không</option></select>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" id="btn-filter">Lọc</button>
    <button class="btn btn-outline btn-sm" id="btn-reset">Xóa lọc</button>
  </div>

  <div class="card table-scroll">
    <table id="leads-table">
      <thead><tr><th>Ngày tạo</th><th>Tên</th><th>SĐT</th><th>Khung giờ</th><th>Mã</th><th>Nhánh</th><th>Trạng thái</th><th>Ưu đãi</th></tr></thead>
      <tbody id="leads-tbody"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>
<script src="/admin-assets/common.js"></script>
<script src="/admin-assets/leads.js"></script>
</body>
</html>
