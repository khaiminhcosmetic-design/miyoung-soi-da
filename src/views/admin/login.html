<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập quản trị - MIYOUNG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body>
<div class="wrap-narrow">
  <h1 style="text-align:center;">MIYOUNG · Trang quản trị</h1>
  <div class="card">
    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="btn-submit">Đăng nhập</button>
      <div class="error-text" id="error-text"></div>
    </form>
  </div>
</div>
<script src="/admin-assets/login.js"></script>
</body>
</html>
